<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cedarwood Studio: authorization received</title>
<style>
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #171d22; background: #f4f6f7; margin: 0; padding: 2rem 1rem; }
  main { max-width: 36rem; margin: 0 auto; background: #fff; border: 1px solid #d8dfe4; padding: 1.5rem; }
  h1 { font-size: 1.3rem; margin: 0 0 .75rem; }
  p { margin: .5rem 0; }
  textarea { width: 100%; box-sizing: border-box; font: 14px ui-monospace, Menlo, monospace; padding: .6rem; border: 1px solid #d8dfe4; min-height: 5.5rem; }
  button { font: inherit; padding: .5rem 1rem; border: 1px solid #2b5171; background: #2b5171; color: #fff; cursor: pointer; margin-top: .5rem; }
  .err { color: #9b2f2a; }
  .muted { color: #55606a; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1 id="h">Authorization received</h1>
  <p id="msg">Paste the line below where you were asked for it. It is a one-time code and expires in a few minutes.</p>
  <textarea id="out" readonly></textarea>
  <button id="copy" type="button">Copy</button>
  <p class="muted">Nothing on this page is sent anywhere. The code only becomes a token once it is exchanged with Upwork.</p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var out = document.getElementById('out');
  var h = document.getElementById('h');
  var msg = document.getElementById('msg');
  if (q.get('error')) {
    h.textContent = 'Authorization failed';
    h.className = 'err';
    msg.textContent = 'Upwork returned an error. Paste the line below where you were asked for it.';
    out.value = location.href;
  } else if (q.get('code')) {
    out.value = location.href;
  } else {
    h.textContent = 'Nothing to do here';
    msg.textContent = 'This page only has a job at the end of an Upwork authorization.';
    out.value = '';
  }
  document.getElementById('copy').addEventListener('click', function () {
    out.select();
    try { navigator.clipboard.writeText(out.value); } catch (e) { document.execCommand('copy'); }
  });
})();
</script>
</body>
</html>
